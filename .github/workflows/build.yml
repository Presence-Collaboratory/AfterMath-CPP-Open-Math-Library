name: AfterMath CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_DIR: ${{ github.workspace }}/build

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        platform: [x64, Win32]
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Visual Studio installation
        id: vs
        run: |
          $vsPath = & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          echo "VS_PATH=$vsPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "VS_PATH=$vsPath"
        shell: pwsh

      - name: Setup MSBuild (optional)
        uses: microsoft/setup-msbuild@v2

      - name: Configure CMake
        run: cmake -S "${{ github.workspace }}" -B "${{ env.BUILD_DIR }}" -G "Visual Studio 17 2022" -A "${{ matrix.platform }}" -DCMAKE_GENERATOR_INSTANCE="${{ env.VS_PATH }}"

      - name: Build
        run: cmake --build "${{ env.BUILD_DIR }}" --config ${{ matrix.configuration }} --parallel

      - name: Test
        working-directory: ${{ env.BUILD_DIR }}
        run: ctest -C ${{ matrix.configuration }} --output-on-failure

      - name: Upload test executable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AfterMathTests-${{ matrix.platform }}-${{ matrix.configuration }}
          path: ${{ env.BUILD_DIR }}/tests/${{ matrix.configuration }}/AfterMathTests.exe
          if-no-files-found: ignore
